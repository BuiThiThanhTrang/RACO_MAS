          on the heavy oak door of a stranger,

          the sharp intake of breath

          when the lock turns back.


          It is the light bridge

          thrown across the chasm of silence,

          a syllable testing the air

          to see if it might bloom

          into a conversation.


          Not quite a promise,

          but a gentle invitation:

          *I am here,

          and I am listening.*'
