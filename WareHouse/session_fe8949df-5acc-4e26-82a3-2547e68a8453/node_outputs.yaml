        source: article writer
node_poet:
  node_id: poet
  node_type: agent
  predecessors_num: 0
  successors_num: 1
  results:
  - type: message
    payload:
      role: assistant
      content:
      - type: text
        text: '**Hello**


          A door left slightly ajar,

          the quiet intake of breath

          before the plunge into conversation.


          It is the soft collision of two orbits,

          a sudden bridge built over the gap

          of "stranger" and "known."


          Two syllables—

          a small, fragile ignition,

          a tiny white flag waved in the dark

          to see if anything answers back.'
      metadata:
        source: poet
