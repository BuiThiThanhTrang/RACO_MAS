packet_root: data/RoutingBench/structured_table_qa_v1_40
output_root: runs
domain: structured_data_processing
role_cards: config/shared_environment/table_qa_roles.json
seed: 42
max_calls: 12
workers: 1
router:
  type: decision
  provider: openrouter
  model: perplexity/pplx-decider-flash-v1.2
  api_key_env: OPENROUTER_API_KEY
  orchestration_profile: structured
  observable_rejection_guard_enabled: false
  timeout_seconds: 300
  max_retries: 5
  retry_backoff_seconds: 2
  max_retry_delay_seconds: 30
executor:
  provider: openrouter
  model: qwen/qwen3.5-9b
  api_key_env: OPENROUTER_API_KEY
  max_tokens: 16384
  timeout_seconds: 300
  transport_retries: 5
  max_tool_calls: 1
