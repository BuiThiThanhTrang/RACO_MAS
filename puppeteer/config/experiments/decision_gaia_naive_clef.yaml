mode: frozen
seed: 42
personas_path: personas/role_aware/gaia_qwen35_9b_pool.jsonl
output_dir: runs

dataset:
  name: GAIA
  mode: validation
  level: 1
  data_limit: null
  data_start: 0
  split_seed: 42

tools:
  allowed: [read_file, inspect_media, inspect_spreadsheet, search_web, access_website, run_python]

profiles:
  mode: static_role_cards
  update_enabled: false
  include_uncertainty: false
  reset_scope: run
  initialization:
    source: role_cards
    path: null
    required_for_train: false

experience:
  mode: none
  reset_scope: run
  retrieval_limit: 20

policy:
  type: decision_model_planner
  policy_mode: frozen
  routing_guard:
    enabled: true
    profile: gaia_stage_v2
    max_role_calls_per_path: 3
    prevent_role_repeat_same_state: true
  decision:
    provider: openrouter
    model: cloudflare/clef
    api_key_env: OPENROUTER_API_KEY
    timeout_seconds: 30
    max_retries: 5
    retry_backoff_seconds: 2
    max_retry_delay_seconds: 30
    max_options: 255
    root_selection_mode: sequential
    experience_limit: 20

global_config:
  graph:
    max_width: 2
    max_depth: 5
  aggregation:
    mode: majority_verifier
    verifier_model: gpt-6-luna-openrouter
    seed: 42
