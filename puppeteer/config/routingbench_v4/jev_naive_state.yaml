seed: 42
output_dir: runs
benchmark:
  data_dir: data/RoutingBench/v4_alpha
  split: development
  track: all
  memory_view: state
router:
  type: decision
  provider: openrouter
  model: typesafe/jev-1.13
  api_key_env: OPENROUTER_API_KEY
  orchestration_profile: naive
  timeout_seconds: 30
  max_retries: 5
  retry_backoff_seconds: 2
  max_retry_delay_seconds: 30
