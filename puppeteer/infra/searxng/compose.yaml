name: raco-searxng

services:
  searxng:
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    container_name: raco-searxng
    restart: unless-stopped
    ports:
      # Keep the instance private to this machine.
      - "127.0.0.1:${SEARXNG_PORT:-8080}:8080"
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://localhost:8080/}
      # Safe only because the port is bound to loopback. Override in .env if
      # this service is ever placed behind a public reverse proxy.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-raco-mas-local-only-change-me}
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng

volumes:
  searxng-cache:
