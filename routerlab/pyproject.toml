[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-router-lab"
version = "0.1.0"
description = "Controlled evaluation of executor routing for multi-agent code generation"
requires-python = ">=3.11"
dependencies = [
  "accelerate>=0.26.0",
  "evalplus==0.3.1",
  "openai>=1.50.0",
  "PyYAML>=6.0.1",
  "torch>=2.1.0",
  "transformers>=4.47.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
routerlab = "routerlab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
routerlab = ["prompts/*.txt"]
